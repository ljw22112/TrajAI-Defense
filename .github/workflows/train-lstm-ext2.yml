name: train-lstm-ext2
# Second round for the PINN-Bi-LSTM RMSE target (ID 10 % RMSE <= 1.2 x EKF): starting from the RTS-input model,
#   + EKF posterior features (hybrid), + 5-20 % training range, + twice the training steps.
# Runs on a push to the train-lstm-ext2 branch (or by hand) and commits the results back to that branch.
on:
  push:
    branches: [train-lstm-ext2]
  workflow_dispatch:

concurrency: {group: train-lstm-ext2, cancel-in-progress: false}
defaults: {run: {shell: bash}}

jobs:
  prep:
    name: datasets + EKF/UKF baselines + RTS features
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - run: pip install numpy scipy
      - run: python scripts/make_dataset.py --only train_aug val_aug train_wide_aug val_wide_aug test_id_f05 test_id_f10 test_id_f15 test_id_noise test_ood
      - run: python scripts/prepare.py
      - run: python scripts/prep_rts.py
      - uses: actions/upload-artifact@v7
        with:
          name: prepared
          retention-days: 7
          path: |
            data/prep_*.npz
            results/baseline_*.npz

  train:
    name: train ${{ matrix.name }}
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: pinn_lstm_rts_hyb,  lambda: "1.0", seed: 0, steps: 4500, extra: "--feat-key feats_rts --hybrid"}
          - {name: pinn_lstm_rts_wide, lambda: "1.0", seed: 0, steps: 4500, extra: "--feat-key feats_rts --train-split train_wide_aug --val-split val_wide_aug"}
          - {name: pinn_lstm_rts_9k,   lambda: "1.0", seed: 0, steps: 9000, extra: "--feat-key feats_rts"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - run: pip install numpy scipy && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v8
        with: {name: prepared}
      - name: train
        run: |
          mkdir -p checkpoints
          python scripts/train.py --resume --name ${{ matrix.name }} --encoder lstm --lambda-p ${{ matrix.lambda }} \
            --steps ${{ matrix.steps }} --train-split train_aug --val-split val_aug ${{ matrix.extra }} --seed ${{ matrix.seed }} \
            --threads $(nproc) --save-every 500 2>&1 | tee results/train_${{ matrix.name }}.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: model-${{ matrix.name }}
          retention-days: 30
          path: |
            checkpoints/${{ matrix.name }}.pt
            results/train_${{ matrix.name }}.json
            results/train_${{ matrix.name }}.log

  evaluate:
    name: evaluate + commit results
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - run: pip install numpy scipy && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v8
        with: {name: prepared}
      - uses: actions/download-artifact@v8
        with: {pattern: "model-*", merge-multiple: true}
      - name: evaluate
        run: |
          python scripts/evaluate.py pinn_lstm_v2_rts pinn_lstm_rts_hyb pinn_lstm_rts_wide pinn_lstm_rts_9k | tee results/evaluate_lstm_ext2.log
          for m in pinn_lstm_rts_hyb pinn_lstm_rts_wide pinn_lstm_rts_9k; do
            python scripts/lstm_compare.py --a $m --b pinn_lstm_v2_rts --out results/lstm_${m}_vs_rts.json | tee -a results/evaluate_lstm_ext2.log
          done
      - name: commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add results/metrics.json results/lstm_*.json results/train_*lstm*.json
          git add -f results/train_*lstm*.log results/evaluate_lstm_ext2.log checkpoints/*lstm*.pt
          git commit -m "PINN-Bi-LSTM RMSE round 2: RTS + hybrid / wide range / 9000 steps" && git push
