name: ci
on:
  push:
    branches: [main, wip]
  pull_request:

jobs:
  core:
    name: trajai core (physics, filters, weather)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install numpy scipy pytest
      - run: python -m pytest -q tests
      - run: python scripts/check_site.py        # report numbers vs results/*.json, links, section refs
      - run: python scripts/check_contrast.py    # console colour tokens: WCAG AA in light / dark / military

  backend:
    name: API (FastAPI + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: trajai_test}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TRAJAI_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/trajai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r server/requirements.txt pytest
      - name: migrations round-trip
        working-directory: server
        run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
      - name: API tests on PostgreSQL
        run: TRAJAI_TEST_DATABASE_URL=$TRAJAI_DATABASE_URL python -m pytest -q server/tests
      - name: API tests on SQLite
        run: env -u TRAJAI_DATABASE_URL python -m pytest -q server/tests

  frontend:
    name: web (TypeScript, Vitest, build)
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    name: security (dependencies, static analysis, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: pip install pip-audit bandit
      - name: Python dependencies (known CVEs)
        run: pip-audit -r server/requirements.txt -r requirements.txt
      - name: Python static analysis (medium and above)
        run: bandit -q -r server/app trajai -ll
      - name: Web dependencies shipped to the browser (known CVEs)
        working-directory: web
        run: npm ci --no-audit --no-fund && npm audit --omit=dev --audit-level=moderate
      - name: Secret scan (git history)
        uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
