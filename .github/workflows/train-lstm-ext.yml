name: train-lstm-ext
# Follow-up experiments for the Bi-LSTM pair (§9.11), same setup as train-lstm.yml (4500 steps, lambda_p 1.0 / 0):
#   seeds 1, 2          -> is the physics-loss effect larger than training randomness?
#   RTS track features  -> does the input improvement seen with the Transformer carry over to the LSTM (RMSE target)?
#   5–20 % observation  -> is the ID 5 % failure an artefact of the 8–20 % training range?
# Runs on a push to the train-lstm-ext branch (or by hand) and commits the results back to that branch.
on:
  push:
    branches: [train-lstm-ext]
  workflow_dispatch:

concurrency: {group: train-lstm-ext, cancel-in-progress: false}
defaults: {run: {shell: bash}}

jobs:
  prep:
    name: datasets + EKF/UKF baselines + RTS features
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - run: pip install numpy scipy
      - run: python scripts/make_dataset.py --only train_aug val_aug train_wide_aug val_wide_aug test_id_f05 test_id_f10 test_id_f15 test_id_noise test_ood
      - run: python scripts/prepare.py
      - run: python scripts/prep_rts.py
      - uses: actions/upload-artifact@v4
        with:
          name: prepared
          retention-days: 7
          path: |
            data/prep_*.npz
            results/baseline_*.npz

  train:
    name: train ${{ matrix.name }}
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: data_lstm_v2_s1,   lambda: "0",   seed: 1, extra: ""}
          - {name: pinn_lstm_v2_s1,   lambda: "1.0", seed: 1, extra: ""}
          - {name: data_lstm_v2_s2,   lambda: "0",   seed: 2, extra: ""}
          - {name: pinn_lstm_v2_s2,   lambda: "1.0", seed: 2, extra: ""}
          - {name: data_lstm_v2_rts,  lambda: "0",   seed: 0, extra: "--feat-key feats_rts"}
          - {name: pinn_lstm_v2_rts,  lambda: "1.0", seed: 0, extra: "--feat-key feats_rts"}
          - {name: data_lstm_wide,    lambda: "0",   seed: 0, extra: "--train-split train_wide_aug --val-split val_wide_aug"}
          - {name: pinn_lstm_wide,    lambda: "1.0", seed: 0, extra: "--train-split train_wide_aug --val-split val_wide_aug"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - run: pip install numpy scipy && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with: {name: prepared}
      - name: train
        run: |
          mkdir -p checkpoints
          python scripts/train.py --resume --name ${{ matrix.name }} --encoder lstm --lambda-p ${{ matrix.lambda }} \
            --steps 4500 --train-split train_aug --val-split val_aug ${{ matrix.extra }} --seed ${{ matrix.seed }} \
            --threads $(nproc) --save-every 500 2>&1 | tee results/train_${{ matrix.name }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-${{ matrix.name }}
          retention-days: 30
          path: |
            checkpoints/${{ matrix.name }}.pt
            results/train_${{ matrix.name }}.json
            results/train_${{ matrix.name }}.log

  evaluate:
    name: evaluate + commit results
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - run: pip install numpy scipy && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with: {name: prepared}
      - uses: actions/download-artifact@v4
        with: {pattern: "model-*", merge-multiple: true}
      - name: evaluate
        run: |
          M="data_lstm_v2 pinn_lstm_v2 data_lstm_v2_s1 pinn_lstm_v2_s1 data_lstm_v2_s2 pinn_lstm_v2_s2 data_lstm_v2_rts pinn_lstm_v2_rts data_lstm_wide pinn_lstm_wide"
          python scripts/evaluate.py $M | tee results/evaluate_lstm_ext.log
          for p in "pinn_lstm_v2_s1 data_lstm_v2_s1 seed1" "pinn_lstm_v2_s2 data_lstm_v2_s2 seed2" \
                   "pinn_lstm_v2_rts data_lstm_v2_rts rts" "pinn_lstm_wide data_lstm_wide wide"; do
            set -- $p
            python scripts/lstm_compare.py --a $1 --b $2 --out results/lstm_vs_pinn_$3.json | tee -a results/evaluate_lstm_ext.log
          done
          # RTS vs SG input for the same (PINN) model, and wide vs nominal training range
          python scripts/lstm_compare.py --a pinn_lstm_v2_rts --b pinn_lstm_v2 --out results/lstm_rts_vs_sg.json | tee -a results/evaluate_lstm_ext.log || true
          python scripts/lstm_compare.py --a pinn_lstm_wide --b pinn_lstm_v2 --out results/lstm_wide_vs_nominal.json | tee -a results/evaluate_lstm_ext.log || true
      - name: commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add results/metrics.json results/lstm_*.json results/train_*lstm*.json
          git add -f results/train_*lstm*.log results/evaluate_lstm_ext.log checkpoints/*lstm*.pt
          git commit -m "LSTM follow-ups: seeds 1-2, RTS input, 5-20 % training range" && git push
