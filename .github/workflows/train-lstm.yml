name: train-lstm
# LSTM vs PINN: the same LSTM encoder trained without (data_lstm_v2) and with (pinn_lstm_v2) the physics loss,
# on the v2 setup of the Transformer pair (train_aug / val_aug, 4500 steps, lambda_p 1.0).
# Runs on a push to the train-lstm branch (or by hand) and commits the results back to the branch that ran it.
on:
  push:
    branches: [train-lstm]
  workflow_dispatch:

concurrency: {group: train-lstm, cancel-in-progress: false}
defaults: {run: {shell: bash}}   # bash -eo pipefail: a failed step is not hidden by tee

jobs:
  prep:
    name: dataset + EKF/UKF baselines
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install numpy scipy
      - run: python scripts/make_dataset.py --only train_aug val_aug test_id_f05 test_id_f10 test_id_f15 test_id_noise test_ood
      - run: python scripts/prepare.py
      - uses: actions/upload-artifact@v4
        with:
          name: prepared
          retention-days: 7
          path: |
            data/prep_*.npz
            results/baseline_*.npz

  train:
    name: train ${{ matrix.name }}
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: data_lstm_v2, lambda: "0"}
          - {name: pinn_lstm_v2, lambda: "1.0"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install numpy scipy && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with: {name: prepared}
      - name: train
        run: |
          mkdir -p checkpoints
          python scripts/train.py --resume --name ${{ matrix.name }} --encoder lstm --lambda-p ${{ matrix.lambda }} \
            --steps 4500 --train-split train_aug --val-split val_aug --threads $(nproc) --save-every 500 \
            2>&1 | tee results/train_${{ matrix.name }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-${{ matrix.name }}
          retention-days: 30
          path: |
            checkpoints/${{ matrix.name }}.pt
            results/train_${{ matrix.name }}.json
            results/train_${{ matrix.name }}.log

  evaluate:
    name: evaluate + commit results
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install numpy scipy && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with: {name: prepared}
      - uses: actions/download-artifact@v4
        with: {name: model-data_lstm_v2}
      - uses: actions/download-artifact@v4
        with: {name: model-pinn_lstm_v2}
      - run: python scripts/evaluate.py data_lstm_v2 pinn_lstm_v2 | tee results/evaluate_lstm.log
      - run: python scripts/lstm_compare.py | tee -a results/evaluate_lstm.log
      - name: commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add results/metrics.json results/lstm_vs_pinn.json results/train_*_lstm_v2.json
          git add -f results/train_*_lstm_v2.log results/evaluate_lstm.log checkpoints/data_lstm_v2.pt checkpoints/pinn_lstm_v2.pt
          git commit -m "LSTM vs PINN: train and evaluate data_lstm_v2 / pinn_lstm_v2" && git push
