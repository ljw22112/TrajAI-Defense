# docker compose up --build   ->  http://localhost:8000  (console)  /api/docs (OpenAPI)
services:
  db:
    image: postgres:16-alpine            # not published to the host: reachable only from the api container
    environment:
      POSTGRES_USER: trajai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: trajai
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trajai"]
      interval: 5s
      retries: 10
  api:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment:
      TRAJAI_ENV: prod                    # refuses default secrets, hides /api/docs, sends HSTS
      TRAJAI_DATABASE_URL: postgresql+psycopg2://trajai:${POSTGRES_PASSWORD}@db:5432/trajai
      TRAJAI_JWT_SECRET: ${TRAJAI_JWT_SECRET:?set TRAJAI_JWT_SECRET (e.g. openssl rand -hex 32)}
      TRAJAI_ADMIN_PASSWORD: ${TRAJAI_ADMIN_PASSWORD:?set TRAJAI_ADMIN_PASSWORD (12+ characters)}
      TRAJAI_CORS_ORIGINS: '["http://localhost:8000"]'
    ports: ["127.0.0.1:8000:8000"]       # loopback only; put a TLS reverse proxy in front for remote access
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
volumes:
  pgdata:
